name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10', mode: full}
          - {os: ubuntu-latest, python: '3.14', mode: full}
          - {os: macos-latest, python: '3.14', mode: full}
          - {os: ubuntu-latest, python: '3.14', mode: base}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: ${{ matrix.python }}
      - name: Install Cairo (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config
      - name: Install Cairo (macOS)
        if: runner.os == 'macOS'
        run: brew install cairo pkgconf
      - name: Install full development environment
        if: matrix.mode == 'full'
        run: uv sync --locked --extra gaussian
      - name: Install base development environment
        if: matrix.mode == 'base'
        run: uv sync --locked
      - name: Run every discovered test with skip auditing
        env:
          SMART_REPORT_QA_DIR: ${{ runner.temp }}/report-qa
        run: uv run --no-sync python scripts/run_tests.py ${{ matrix.mode }}
      - name: Upload report previews for review
        if: always() && matrix.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: report-qa-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/report-qa
          if-no-files-found: error
      - name: Type check
        run: uv run --no-sync pyright
      - name: Compile sources and examples
        run: uv run --no-sync python -m compileall -q src tests examples scripts
      - name: Build distributions
        run: uv run --no-sync python -m build
      - name: Verify installed wheel outside the checkout
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/wheel-smoke"
          uv pip install --python "$RUNNER_TEMP/wheel-smoke/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -c 'from smart_report import document; doc = document(); doc.page().add_text("Wheel smoke"); assert doc.save_to_bytes().startswith(b"%PDF")'
